syntax = "proto3";
package google.rpc;
import "google/protobuf/any.proto";
// Wire-compatible subset of Google's public google.rpc error model.
message Status {
  int32 code = 1;
  string message = 2;
  repeated google.protobuf.Any details = 3;
}
message ErrorInfo {
  string reason = 1;
  string domain = 2;
  map<string, string> metadata = 3;
}
